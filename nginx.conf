server {
    listen 80;
    server_name _;
    root /app/out;
    index index.html;
    client_max_body_size 512m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy /process to the backend (file upload + SSE streaming)
    location /process {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache_bypass 1;
        proxy_read_timeout 300s;
    }

    # Proxy /health to the backend
    location /health {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Serve output files from the backend (use ^~ to bypass static asset regex cache)
    location ^~ /output/ {
        proxy_pass http://backend:5000/output/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|woff|woff2|ttf|eot|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
