[build-system]
requires = ["pip>=24.0", "setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reframe-ai"
version = "0.1.0"
description = "Subject-aware media pipeline MVP"
requires-python = ">=3.14"
dependencies = [
    "numpy",
    "pillow",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
