[build-system]
requires = ["pip>=24.0", "setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reframe-ai"
version = "0.1.0"
description = "Subject-aware media pipeline MVP"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "numpy",
    "pillow",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "google-genai>=1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
