# ReframeAI Platform Specification v1.0
# Machine-readable definition of valid output assets.
# The validator (src/validator.py) reads this file and enforces every rule here.
#
# Structure:
#   asset_types: top-level categories of outputs
#   common: rules that apply to all asset types
#   validation: rule definitions the validator implements

common:
  version: "1.0"
  watermark:
    must_be_present: true
    text: "HOICCHO HACKATHON COPY"
    # The watermark must not be cropped out entirely.
    # It may be partially visible but must appear in at least one output.
    min_coverage_pct: 0.0  # 0 = must be present somewhere; higher = more visible

asset_types:

  image_variant:
    description: "A subject-aware crop of the master image"
    source: "data/input_image.png"
    formats:
      - name: "16_9"
        aspect_ratio: 1.7778
        description: "Landscape, 16:9"
        min_width: 1080
        min_height: 608
        max_width: 3840
        max_height: 2160
        subject_framing:
          # The primary subject must occupy 30%-70% of the frame area
          # and must not be cut off by more than 20% on any edge.
          min_subject_area_pct: 30
          max_subject_area_pct: 70
          max_edge_cutoff_pct: 20
        required_metadata:
          - crop_bbox
          - subject_center
          - importance_score

      - name: "1_1"
        aspect_ratio: 1.0
        min_width: 800
        min_height: 800
        max_width: 4000
        max_height: 4000
        subject_framing:
          min_subject_area_pct: 30
          max_subject_area_pct: 70
          max_edge_cutoff_pct: 20
        required_metadata:
          - crop_bbox
          - subject_center
          - importance_score

      - name: "9_16"
        aspect_ratio: 0.5625
        min_width: 720
        min_height: 1280
        max_width: 2160
        max_height: 3840
        subject_framing:
          min_subject_area_pct: 35
          max_subject_area_pct: 75
          max_edge_cutoff_pct: 25
        required_metadata:
          - crop_bbox
          - subject_center
          - importance_score

      - name: "4_5"
        aspect_ratio: 0.8
        min_width: 800
        min_height: 1000
        max_width: 3200
        max_height: 4000
        subject_framing:
          min_subject_area_pct: 30
          max_subject_area_pct: 70
          max_edge_cutoff_pct: 20
        required_metadata:
          - crop_bbox
          - subject_center
          - importance_score

  video_reel:
    description: "Speaker-aware vertical video reel"
    source: "data/input_video.mp4"
    format:
      aspect_ratio: 0.5625
      codec: "h264"
      min_width: 720
      min_height: 1280
      max_width: 1080
      max_height: 1920
      min_duration_sec: 5
      max_duration_sec: 190
      audio_required: true
      audio_codec: "aac"
      min_fps: 24
      subject_tracking:
        # The speaker must remain visible (at least 20% of frame area)
        # in at least 70% of frames.
        min_tracking_frame_pct: 70
        min_subject_on_screen_pct: 20
      required_metadata:
        - crop_trajectory
        - speaker_ids
        - scene_boundaries
        - keyframe_crops

  still_frame:
    description: "Best still extracted from the master video"
    source: "data/input_video.mp4"
    format:
      aspect_ratio: 1.0
      min_width: 800
      min_height: 800
      max_width: 1920
      max_height: 1920
      required_metadata:
        - source_timestamp
        - sharpness_score
        - speaker_activity_score

# Validation rule definitions — the validator checks each rule below
validation_rules:

  dimensions:
    # Actual output dimensions must match the target aspect ratio within tolerance
    aspect_ratio_tolerance: 0.02  # ±2% allowed
    # Must satisfy min/max bounds in the spec
    check_min_max: true

  subject_framing:
    # Subject must not be cut off by more than max_edge_cutoff_pct
    # on any of the 4 edges of the crop
    enabled: true

  watermark_preservation:
    # Watermark text must appear in the output (for image variants and still)
    # For video, must appear in at least one frame
    enabled: true

  audio_presence:
    # Video reels must have an audio track
    enabled: true

  metadata_presence:
    # Every required_metadata field in the manifest must be populated
    enabled: true

manifest_format:
  version: "1.0"
  required_fields:
    - asset_type
    - asset_name
    - input_hash
    - input_path
    - output_path
    - output_dimensions
    - crop_params
    - validation_passed
    - validation_warnings
    - processing_time_sec
    - timestamp
